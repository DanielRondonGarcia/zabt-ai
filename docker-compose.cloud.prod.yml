# Single-machine production image override for the base Compose topology.
#
# Run this file together with docker-compose.yml. The cloud-prod profile keeps
# PostgreSQL, MinIO, Redis, and the bundled GPU transcription worker on the same
# Compose network as the published API, worker, web, and vision images.
# Do not copy secrets into this file.
#
# TLS is terminated by the external NetBird/Caddy/reverse-proxy layer. Route the
# web public domain to the peer's HTTP port 3000 and the API public domain to the
# peer's HTTP port 8000. This file intentionally adds neither Kong nor certificates.

x-cloud-backend-environment: &cloud-backend-environment
  # Local stateful services. The service names resolve on the Compose network.
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for cloud production}
  REDIS_URL: redis://redis:6379/0

  # First-party local authentication shared by api, worker, and beat.
  AUTH_ENVIRONMENT: production
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set for cloud production}
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-zabt-api}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-zabt-client}
  AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  AUTH_REFRESH_SESSION_EXPIRE_DAYS: ${AUTH_REFRESH_SESSION_EXPIRE_DAYS:-30}
  AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-zabt_access_token}
  AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-zabt_refresh_token}
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?AUTH_ALLOWED_ORIGINS must be set for cloud production}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS must be set for cloud production}
  APP_URL: ${APP_URL:?APP_URL must be set for cloud production}

  # Text summaries use the first-party OpenAI endpoint.
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set for cloud summaries}
  OPENAI_MODEL: gpt-4o-mini

  # Local MinIO is the only backend storage provider in this topology. The
  # public endpoint must be reachable by the browser when it uploads/downloads
  # objects through presigned URLs.
  STORAGE_PROVIDER: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set for cloud production}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set for cloud production}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME must be set for cloud production}
  MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:-change-me-in-production}
  MINIO_SECURE: ${MINIO_SECURE:-false}

  # Transcription is performed by the bundled GPU worker over the internal
  # Compose network. No external transcription provider is configured here.
  TRANSCRIPTION_BACKEND: gpu-local
  GPU_SERVICE_URL: http://worker-gpu:8001
  GPU_LOCAL_TIMEOUT: ${GPU_LOCAL_TIMEOUT:-7200}

  # Visual analysis uses the internal vision worker, which calls OpenAI over
  # HTTPS with a separate credential and an explicit host allowlist.
  VISION_ENABLED: "true"
  VISION_BACKEND: local
  VISION_LOCAL_URL: ${VISION_LOCAL_URL:-http://zabt-vision-worker:8003}
  VISION_INFERENCE_BACKEND: openai
  VISION_CLOUD_ALLOWED: "true"
  VISION_EGRESS_POLICY: allowlist
  VISION_ALLOWED_HOSTS: api.openai.com
  VISION_JUDGE_MODEL: gpt-4o-mini
  VISION_REQUIRE_VISION: "true"
  VISION_OPENAI_API_KEY: ${VISION_OPENAI_API_KEY:?VISION_OPENAI_API_KEY must be set for cloud vision}
  VISION_OPENAI_BASE_URL: https://api.openai.com/v1
  VISION_OPENAI_MODEL: gpt-4o-mini
  VISION_OPENAI_IMAGE_DETAIL: low
  VISION_OPENAI_MAX_TOKENS: 1024
  VISION_MAX_RETRIES: ${VISION_MAX_RETRIES:-2}
  VISION_RETRY_BACKOFF_SECONDS: ${VISION_RETRY_BACKOFF_SECONDS:-5}
  VISION_POLL_INTERVAL: ${VISION_POLL_INTERVAL:-5}
  VISION_TIMEOUT: ${VISION_TIMEOUT:-1800}
  VISION_SIGNED_URL_EXPIRATION: ${VISION_SIGNED_URL_EXPIRATION:-3600}

  SUMMARY_CHUNK_SECONDS: ${SUMMARY_CHUNK_SECONDS:-120}
  SUMMARY_MAX_INPUT_TOKENS: ${SUMMARY_MAX_INPUT_TOKENS:-6000}

  # Optional integrations and observability retain the base Compose defaults.
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/microsoft/callback}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-no-reply@zabt.ai}
  NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  BOT_WORKER_URL: ${BOT_WORKER_URL:-http://worker-bot:8002}
  POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
  POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: production
  LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}

services:
  api:
    image: ${ZABT_API_IMAGE:?ZABT_API_IMAGE must be set to an immutable GHCR release image}
    environment: !override
      <<: *cloud-backend-environment

  worker:
    image: ${ZABT_WORKER_IMAGE:?ZABT_WORKER_IMAGE must be set to an immutable GHCR release image}
    environment: !override
      <<: *cloud-backend-environment

  beat:
    image: ${ZABT_WORKER_IMAGE:?ZABT_WORKER_IMAGE must be set to an immutable GHCR release image}
    environment: !override
      <<: *cloud-backend-environment

  # Redis remains always-on and keeps the local worker network unchanged.
  redis: {}

  # Activate the base local stateful services in the production profile. Their
  # named volumes and service names are intentionally inherited unchanged.
  db:
    profiles: !override [cloud-prod]

  minio:
    profiles: !override [cloud-prod]

  minio-init:
    profiles: !override [cloud-prod]

  # Local GPU transcription worker. The base service retains its NVIDIA device
  # reservation and model-cache volume; only its profile, image, and host ports
  # are changed for this internal production deployment.
  worker-gpu:
    image: ${ZABT_GPU_IMAGE:?ZABT_GPU_IMAGE must be set to an immutable GHCR release image}
    profiles: !override [cloud-prod]
    ports: !override []
    environment:
      MODE: local
      PORT: 8001
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      MEDASR_MODEL: ${MEDASR_MODEL:-google/medasr}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_MIN_SPEAKERS: ${DIARIZATION_MIN_SPEAKERS:-1}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}

  web:
    image: ${ZABT_WEB_IMAGE:?ZABT_WEB_IMAGE must be set to an immutable GHCR release image}
    # Replace, rather than append to, the base [local] profile.
    profiles: !override [cloud-prod]
    build:
      context: .
      dockerfile: frontend-2/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set for cloud production}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:?NEXT_PUBLIC_FRONTEND_URL must be set for cloud production}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    ports: !override
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set for cloud production}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:?NEXT_PUBLIC_FRONTEND_URL must be set for cloud production}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production

  zabt-vision-worker:
    image: ${ZABT_VISION_IMAGE:?ZABT_VISION_IMAGE must be set to an immutable GHCR release image}
    # Replace the base [vision] profile; this service is internal to api.
    profiles: !override [cloud-prod]
    ports: !override []
    deploy: !reset null
    extra_hosts: !override []
    environment:
      VISION_ENABLED: "true"
      VISION_INFERENCE_BACKEND: openai
      VISION_JUDGE_MODEL: gpt-4o-mini
      VISION_CLOUD_ALLOWED: "true"
      VISION_EGRESS_POLICY: allowlist
      VISION_ALLOWED_HOSTS: api.openai.com
      VISION_OPENAI_API_KEY: ${VISION_OPENAI_API_KEY:?VISION_OPENAI_API_KEY must be set for cloud vision}
      VISION_OPENAI_BASE_URL: https://api.openai.com/v1
      VISION_OPENAI_MODEL: gpt-4o-mini
      VISION_OPENAI_IMAGE_DETAIL: low
      VISION_OPENAI_MAX_TOKENS: 1024
      VISION_REQUIRE_VISION: "true"
      # The worker uses MinIO's S3-compatible API with fixed internal service
      # networking; no managed-storage variables are required.
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set for cloud production}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set for cloud production}
      S3_BUCKET: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME must be set for cloud production}
      OCR_USE_GPU: "false"
      OLLAMA_NO_CLOUD: "1"
