# zabt.ai — local development and single-machine cloud production stack
#
# Default (one command, runs the FULL stack locally with a local GPU worker):
#   cp .env.example .env    # then edit the 3-4 values marked REQUIRED
#   docker compose up -d
#
# .env sets COMPOSE_PROFILES=local, which turns on the bundled db, object storage,
# GPU transcription worker, and web UI below. No Kong required.
#
# Variations:
#   CPU-only (no NVIDIA GPU):   set COMPOSE_PROFILES=cpu in .env, then docker compose up -d
#   Local Actsis (no GPU):      set COMPOSE_PROFILES=local-actsis in .env, then docker compose up -d
#   Cloud / RunPod split:       set COMPOSE_PROFILES=cloud,kong in .env, then docker compose up -d
#   Cloud production:           set COMPOSE_PROFILES=cloud-prod in .env, then docker compose up -d
#   Full cloud (managed services): set COMPOSE_PROFILES=full-cloud in .env, then docker compose up -d
#   Teams meeting bot:          add "bot" to COMPOSE_PROFILES in .env
#   Visual breakdown (vision):  add "vision" to COMPOSE_PROFILES in .env
#
# Broker and application services start only in deployment profiles. Local uses `local`,
# CPU uses `cpu`, local Actsis uses `local-actsis`, RunPod uses `cloud`, full cloud uses
# `full-cloud`, and the GHCR production topology uses `cloud-prod`.
# Each service has a hard memory cap. Override individual caps in `.env` with the
# matching `ZABT_MEMORY_LIMIT_*` variable when a workload needs more room.

