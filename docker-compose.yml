  beat: &beat-service
    profiles: [local, cpu, local-actsis]
    image: zabt-worker:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_BEAT:-256m}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment: &beat-environment
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set to a strong random value}
