# zabt.ai — single-machine self-hosted stack
#
# Default (one command, runs the FULL stack locally with a local GPU worker):
#   cp .env.example .env    # then edit the 3-4 values marked REQUIRED
#   docker compose up -d
#
# .env sets COMPOSE_PROFILES=local, which turns on the bundled db, object storage,
# GPU transcription worker, and web UI below. No Kong required.
#
# Variations:
#   CPU-only (no NVIDIA GPU):   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#   Cloud / RunPod split:       docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#   Teams meeting bot:          add "bot" to COMPOSE_PROFILES in .env
#   Visual breakdown (vision):  add "vision" to COMPOSE_PROFILES in .env
#
# Services with no `profiles:` always run (redis, api, worker, beat). Services tagged
# `profiles: [local]` only run when COMPOSE_PROFILES includes "local" (the default).

services:
  # ---- Always-on core ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    image: zabt-api:latest
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/media
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      # LLM (summarization and retrieval chat) — OpenAI-compatible endpoint.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Chat can target a separate compatible gateway; by default it reuses OpenAI.
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      # First-party local auth. There is no Compose fallback: every backend
      # process must receive the same strong deployment secret.
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set to a strong random value}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-zabt-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-zabt-client}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      AUTH_REFRESH_SESSION_EXPIRE_DAYS: ${AUTH_REFRESH_SESSION_EXPIRE_DAYS:-30}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-zabt_access_token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-zabt_refresh_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3001}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3001}
      # Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:-change-me-in-production}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      # Transcription selection is independent from summary/chat endpoint settings.
      # openai-file supports official OpenAI and compatible gateways such as Actsis.
      ACTSIS_API_KEY: ${ACTSIS_API_KEY:-}
      ACTSIS_CA_BUNDLE: ${ACTSIS_CA_BUNDLE:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai-file}
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-1}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-https://ai.actsis.internal/v1}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_CLOUD_DIARIZATION: ${TRANSCRIPTION_CLOUD_DIARIZATION:-false}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-}
      TRANSCRIPTION_ALLOWED_LANGUAGES: ${TRANSCRIPTION_ALLOWED_LANGUAGES:-}
      TRANSCRIPTION_TIMESTAMP_MODE: ${TRANSCRIPTION_TIMESTAMP_MODE:-none}
      TRANSCRIPTION_TIMESTAMP_MODEL: ${TRANSCRIPTION_TIMESTAMP_MODEL:-whisper-1}
      TRANSCRIPTION_RESPONSE_FORMAT: ${TRANSCRIPTION_RESPONSE_FORMAT:-json}
      TRANSCRIPTION_SPEAKER_REQUIRED: ${TRANSCRIPTION_SPEAKER_REQUIRED:-false}
      TRANSCRIPTION_OPENAI_SINGLE_REQUEST_MAX_BYTES: ${TRANSCRIPTION_OPENAI_SINGLE_REQUEST_MAX_BYTES:-20000000}
      # Custom gateways such as Actsis can opt in to full-file uploads; 0 keeps chunking.
      TRANSCRIPTION_DIRECT_UPLOAD_MAX_BYTES: ${TRANSCRIPTION_DIRECT_UPLOAD_MAX_BYTES:-0}
      TRANSCRIPTION_OPENAI_CHUNK_MAX_BYTES: ${TRANSCRIPTION_OPENAI_CHUNK_MAX_BYTES:-15000000}
      TRANSCRIPTION_OPENAI_CHUNK_DURATION_SECONDS: ${TRANSCRIPTION_OPENAI_CHUNK_DURATION_SECONDS:-600}
      TRANSCRIPTION_OPENAI_MAX_CHUNKS: ${TRANSCRIPTION_OPENAI_MAX_CHUNKS:-1024}
      TRANSCRIPTION_OPENAI_MAX_RETRIES: ${TRANSCRIPTION_OPENAI_MAX_RETRIES:-2}
      TRANSCRIPTION_OPENAI_RETRY_BACKOFF_SECONDS: ${TRANSCRIPTION_OPENAI_RETRY_BACKOFF_SECONDS:-1}
      TRANSCRIPTION_OPENAI_RETRY_MAX_BACKOFF_SECONDS: ${TRANSCRIPTION_OPENAI_RETRY_MAX_BACKOFF_SECONDS:-8}
      TRANSCRIPTION_FFMPEG_TIMEOUT_SECONDS: ${TRANSCRIPTION_FFMPEG_TIMEOUT_SECONDS:-900}
      # Optional visual processing is disabled unless explicitly enabled.
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_BACKEND: ${VISION_BACKEND:-local}
      VISION_LOCAL_URL: ${VISION_LOCAL_URL:-http://zabt-vision-worker:8003}
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-qwen3-vl:8b-thinking}
      VISION_REQUIRE_VISION: ${VISION_REQUIRE_VISION:-true}
      VISION_MAX_RETRIES: ${VISION_MAX_RETRIES:-2}
      VISION_RETRY_BACKOFF_SECONDS: ${VISION_RETRY_BACKOFF_SECONDS:-5}
      VISION_CLOUD_ALLOWED: ${VISION_CLOUD_ALLOWED:-false}
      VISION_EGRESS_POLICY: ${VISION_EGRESS_POLICY:-deny}
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-}
      VISION_SIGNED_URL_EXPIRATION: ${VISION_SIGNED_URL_EXPIRATION:-3600}
      VISION_RUNPOD_API_KEY: ${VISION_RUNPOD_API_KEY:-}
      VISION_RUNPOD_ENDPOINT_ID: ${VISION_RUNPOD_ENDPOINT_ID:-}
      VISION_POLL_INTERVAL: ${VISION_POLL_INTERVAL:-5}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-1800}
      SUMMARY_CHUNK_SECONDS: ${SUMMARY_CHUNK_SECONDS:-120}
      SUMMARY_MAX_INPUT_TOKENS: ${SUMMARY_MAX_INPUT_TOKENS:-6000}
      # Integrations / notifications (all optional)
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/microsoft/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-no-reply@zabt.ai}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BOT_WORKER_URL: ${BOT_WORKER_URL:-http://worker-bot:8002}
      # Embedding/vector indexing (optional, rollback via INDEXING_ENABLED=false)
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://ai.actsis.internal/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MAX_BATCH: ${EMBEDDING_MAX_BATCH:-32}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-meeting_embeddings}
      INDEXING_ENABLED: ${INDEXING_ENABLED:-true}
      # Observability (all optional)
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - redis

  worker:
    image: zabt-worker:latest
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    # Desktop-safe default: each prefork worker imports the full backend and costs
    # roughly 200 MB. Raise CELERY_WORKER_CONCURRENCY explicitly for production.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - media_data:/media
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set to a strong random value}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-zabt-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-zabt-client}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Chat can target a separate compatible gateway; by default it reuses OpenAI.
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3001}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      # Transcription selection; openai-file supports official OpenAI and Actsis.
      ACTSIS_API_KEY: ${ACTSIS_API_KEY:-}
      ACTSIS_CA_BUNDLE: ${ACTSIS_CA_BUNDLE:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai-file}
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-1}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-https://ai.actsis.internal/v1}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_CLOUD_DIARIZATION: ${TRANSCRIPTION_CLOUD_DIARIZATION:-false}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-}
      TRANSCRIPTION_ALLOWED_LANGUAGES: ${TRANSCRIPTION_ALLOWED_LANGUAGES:-}
      TRANSCRIPTION_TIMESTAMP_MODE: ${TRANSCRIPTION_TIMESTAMP_MODE:-none}
      TRANSCRIPTION_TIMESTAMP_MODEL: ${TRANSCRIPTION_TIMESTAMP_MODEL:-whisper-1}
      TRANSCRIPTION_RESPONSE_FORMAT: ${TRANSCRIPTION_RESPONSE_FORMAT:-json}
      TRANSCRIPTION_SPEAKER_REQUIRED: ${TRANSCRIPTION_SPEAKER_REQUIRED:-false}
      TRANSCRIPTION_OPENAI_SINGLE_REQUEST_MAX_BYTES: ${TRANSCRIPTION_OPENAI_SINGLE_REQUEST_MAX_BYTES:-20000000}
      # Custom gateways such as Actsis can opt in to full-file uploads; 0 keeps chunking.
      TRANSCRIPTION_DIRECT_UPLOAD_MAX_BYTES: ${TRANSCRIPTION_DIRECT_UPLOAD_MAX_BYTES:-0}
      TRANSCRIPTION_OPENAI_CHUNK_MAX_BYTES: ${TRANSCRIPTION_OPENAI_CHUNK_MAX_BYTES:-15000000}
      TRANSCRIPTION_OPENAI_CHUNK_DURATION_SECONDS: ${TRANSCRIPTION_OPENAI_CHUNK_DURATION_SECONDS:-600}
      TRANSCRIPTION_OPENAI_MAX_CHUNKS: ${TRANSCRIPTION_OPENAI_MAX_CHUNKS:-1024}
      TRANSCRIPTION_OPENAI_MAX_RETRIES: ${TRANSCRIPTION_OPENAI_MAX_RETRIES:-2}
      TRANSCRIPTION_OPENAI_RETRY_BACKOFF_SECONDS: ${TRANSCRIPTION_OPENAI_RETRY_BACKOFF_SECONDS:-1}
      TRANSCRIPTION_OPENAI_RETRY_MAX_BACKOFF_SECONDS: ${TRANSCRIPTION_OPENAI_RETRY_MAX_BACKOFF_SECONDS:-8}
      TRANSCRIPTION_FFMPEG_TIMEOUT_SECONDS: ${TRANSCRIPTION_FFMPEG_TIMEOUT_SECONDS:-900}
      GPU_SERVICE_URL: ${GPU_SERVICE_URL:-http://worker-gpu:8001}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_POLL_INTERVAL: ${RUNPOD_POLL_INTERVAL:-5}
      RUNPOD_TIMEOUT: ${RUNPOD_TIMEOUT:-1800}
      GPU_LOCAL_TIMEOUT: ${GPU_LOCAL_TIMEOUT:-7200}
      # Vision (visual breakdown) backend: "local" or "runpod"
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_BACKEND: ${VISION_BACKEND:-local}
      VISION_LOCAL_URL: ${VISION_LOCAL_URL:-http://zabt-vision-worker:8003}
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-qwen3-vl:8b-thinking}
      VISION_REQUIRE_VISION: ${VISION_REQUIRE_VISION:-true}
      VISION_MAX_RETRIES: ${VISION_MAX_RETRIES:-2}
      VISION_RETRY_BACKOFF_SECONDS: ${VISION_RETRY_BACKOFF_SECONDS:-5}
      VISION_CLOUD_ALLOWED: ${VISION_CLOUD_ALLOWED:-false}
      VISION_EGRESS_POLICY: ${VISION_EGRESS_POLICY:-deny}
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-}
      VISION_SIGNED_URL_EXPIRATION: ${VISION_SIGNED_URL_EXPIRATION:-3600}
      VISION_RUNPOD_API_KEY: ${VISION_RUNPOD_API_KEY:-}
      VISION_RUNPOD_ENDPOINT_ID: ${VISION_RUNPOD_ENDPOINT_ID:-}
      VISION_POLL_INTERVAL: ${VISION_POLL_INTERVAL:-5}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-1800}
      SUMMARY_CHUNK_SECONDS: ${SUMMARY_CHUNK_SECONDS:-120}
      SUMMARY_MAX_INPUT_TOKENS: ${SUMMARY_MAX_INPUT_TOKENS:-6000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-no-reply@zabt.ai}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/microsoft/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      BOT_WORKER_URL: ${BOT_WORKER_URL:-http://worker-bot:8002}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://ai.actsis.internal/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MAX_BATCH: ${EMBEDDING_MAX_BATCH:-32}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-meeting_embeddings}
      INDEXING_ENABLED: ${INDEXING_ENABLED:-true}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - redis

  beat:
    image: zabt-worker:latest
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set to a strong random value}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-zabt-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-zabt-client}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      # The beat process imports the summary task module at startup, so it must
      # receive the same OpenAI-compatible provider settings as api and worker.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      APP_URL: ${APP_URL:-http://localhost:3001}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/microsoft/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      BOT_WORKER_URL: ${BOT_WORKER_URL:-http://worker-bot:8002}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    depends_on:
      - redis

  # ---- Local single-machine services (profile: local) ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [local]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-zabt}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: minio/minio
    restart: unless-stopped
    profiles: [local]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: "http://api:8000/api/v1/webhooks/minio"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: "Bearer ${MINIO_WEBHOOK_SECRET:-change-me-in-production}"
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: "/data/.minio/events"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    profiles: [local]
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-zabt-ai-bucket};
      mc event add myminio/${MINIO_BUCKET_NAME:-zabt-ai-bucket} arn:minio:sqs::PRIMARY:webhook --event put --ignore-existing;
      echo 'MinIO bucket + webhook configured';
      "

  # Local GPU transcription worker. Uses the NVIDIA GPU if available and the NVIDIA
  # Container Toolkit is installed; otherwise the image auto-falls-back to CPU int8
  # (slow). For an explicit CPU-only run see docker-compose.cpu.yml.
  worker-gpu:
    image: zabt-gpu-worker:latest
    restart: unless-stopped
    profiles: [local]
    build:
      context: ./zabt-gpu-worker
    ports:
      # The host port is configurable because other local stacks may already use 8001.
      - "${ZABT_WORKER_HOST_PORT:-8001}:8001"
    environment:
      MODE: local
      PORT: 8001
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      MEDASR_MODEL: ${MEDASR_MODEL:-google/medasr}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_MIN_SPEAKERS: ${DIARIZATION_MIN_SPEAKERS:-1}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - worker_model_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    image: zabt-web:latest
    restart: unless-stopped
    profiles: [local]
    build:
      context: .
      dockerfile: frontend-2/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
    depends_on:
      - api

  # ---- Optional add-ons ----
  # Teams meeting bot (headless browser). Enable by adding "bot" to COMPOSE_PROFILES.
  worker-bot:
    image: zabt-bot-worker:latest
    restart: unless-stopped
    profiles: [bot]
    shm_size: "2gb"
    build:
      context: ./zabt-bot-worker
    environment:
      PORT: 8002
      WORKER_ID: bot-worker-1
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-Zabt AI Notetaker}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      S3_REGION: ${S3_REGION:-auto}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      - redis

  # Visual breakdown worker. Supports local Ollama or explicit OpenAI cloud inference.
  # Enable the profile and VISION_ENABLED explicitly; the default remains disabled.
  # Vector store for embeddings (Qdrant). Enable with the local profile.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    profiles: [local]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabt-vision-worker:
    image: zabt-vision-worker:latest
    restart: unless-stopped
    profiles: [vision]
    build:
      context: ./zabt-vision-worker
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-qwen3-vl:8b-thinking}
      VISION_INFERENCE_BACKEND: ${VISION_INFERENCE_BACKEND:-ollama}
      # Keep the vision credential separate from OPENAI_API_KEY, which may target
      # an OpenRouter or other-compatible summary endpoint.
      VISION_OPENAI_API_KEY: ${VISION_OPENAI_API_KEY:-}
      VISION_OPENAI_BASE_URL: ${VISION_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-gpt-4o-mini}
      VISION_OPENAI_IMAGE_DETAIL: ${VISION_OPENAI_IMAGE_DETAIL:-low}
      VISION_OPENAI_MAX_TOKENS: ${VISION_OPENAI_MAX_TOKENS:-1024}
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_REQUIRE_VISION: ${VISION_REQUIRE_VISION:-true}
      # Cloud access is opt-in; OpenAI mode requires explicitly setting these
      # values in the deployment environment.
      VISION_CLOUD_ALLOWED: ${VISION_CLOUD_ALLOWED:-false}
      VISION_EGRESS_POLICY: ${VISION_EGRESS_POLICY:-deny}
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
      # Visual artifacts stay in the bundled MinIO by default. Explicit S3_*
      # variables override these local fallbacks for external S3-compatible storage.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      OCR_USE_GPU: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  media_data:
  redis_data:
  postgres_data:
  minio_data:
  worker_model_cache:
  qdrant_data:
