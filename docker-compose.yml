  # RunPod split services keep the local service definitions and their GPU-local
  # defaults isolated from cloud-specific provider selection.
  api-cloud:
    <<: *api-service
    profiles: [cloud]
    environment:
      <<: *api-environment
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_BACKEND:-runpod}
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-runpod}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    networks:
      default:
        aliases: [api]

  worker-cloud:
    <<: *worker-service
    profiles: [cloud]
    environment:
      <<: *worker-environment
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_BACKEND:-runpod}
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-runpod}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  beat-cloud:
    <<: *beat-service
    profiles: [cloud]
    environment:
      <<: *beat-environment
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_BACKEND:-runpod}
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-runpod}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  # Optional TLS gateway for the advanced RunPod split profile.
  kong:
    image: kong:3.6
    restart: unless-stopped
    profiles: [kong]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "127.0.0.1:8100"
      KONG_LOG_LEVEL: notice
      KONG_SSL_CERT: /etc/kong/ssl/origin.pem
      KONG_SSL_CERT_KEY: /etc/kong/ssl/origin.key
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
      - ./kong/ssl:/etc/kong/ssl:ro
    ports:
      - "80:8000"
      - "443:8443"
    depends_on:
      - api-cloud

  # ---- Local stateful services (profiles: local, cpu, local-actsis) ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_DB:-768m}
    profiles: [local, cpu, local-actsis]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-zabt}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Zabt-maintained source builds; see docs/releasing.md for upstream pins.
  minio:
    image: ghcr.io/danielrondongarcia/zabt-ai-minio:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_MINIO:-768m}
    profiles: [local, cpu, local-actsis]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: "http://api:8000/api/v1/webhooks/minio"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: "Bearer ${MINIO_WEBHOOK_SECRET:-change-me-in-production}"
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: "/data/.minio/events"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: ghcr.io/danielrondongarcia/zabt-ai-mc:latest
    profiles: [local, cpu, local-actsis]
    depends_on:
      - minio
    restart: "no"
    mem_limit: ${ZABT_MEMORY_LIMIT_MINIO_INIT:-128m}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-zabt-ai-bucket};
      mc event add myminio/${MINIO_BUCKET_NAME:-zabt-ai-bucket} arn:minio:sqs::PRIMARY:webhook --event put --ignore-existing;
      echo 'MinIO bucket + webhook configured';
      "

  # Local GPU transcription worker. Uses the NVIDIA GPU if available and the NVIDIA
  # Container Toolkit is installed; otherwise the image auto-falls-back to CPU int8
  # (slow). Use the cpu profile for the CPU-only worker image.
  worker-gpu:
    image: zabt-gpu-worker:latest
    restart: unless-stopped
    # Protective cap for local GPU memory. The default large-v3 + pyannote workload
    # may need a smaller model or a higher explicit override if it is OOM-killed.
    mem_limit: ${ZABT_MEMORY_LIMIT_WORKER_GPU:-4g}
    profiles: [local, gpu]
    build:
      context: ./zabt-gpu-worker
    ports:
      # The host port is configurable because other local stacks may already use 8001.
      - "${ZABT_WORKER_HOST_PORT:-8001}:8001"
    environment:
      MODE: local
      PORT: 8001
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      MEDASR_MODEL: ${MEDASR_MODEL:-google/medasr}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_MIN_SPEAKERS: ${DIARIZATION_MIN_SPEAKERS:-1}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - worker_model_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker-gpu-cpu:
    image: zabt-gpu-worker:cpu
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_WORKER_GPU:-4g}
    profiles: [cpu]
    build:
      context: ./zabt-gpu-worker
      dockerfile: Dockerfile.cpu
    ports:
      - "${ZABT_WORKER_HOST_PORT:-8002}:8001"
    environment:
      MODE: local
      PORT: 8001
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      MEDASR_MODEL: ${MEDASR_MODEL:-google/medasr}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_MIN_SPEAKERS: ${DIARIZATION_MIN_SPEAKERS:-1}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - worker_model_cache:/root/.cache
    networks:
      default:
        aliases: [worker-gpu]

  web:
    image: zabt-web:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_WEB:-512m}
    profiles: [local, cpu, local-actsis]
    build:
      context: .
      dockerfile: frontend-2/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
    ports:
      - "3001:3000"
    environment:
      ZABT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      ZABT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
    depends_on:
      - api

  # ---- Cloud production GHCR stack (profile: cloud-prod) ----
  # These services intentionally use no `build:` fallback. Set ZABT_IMAGE_TAG in
  # the root .env to a published immutable release tag before pulling or starting.
  db-cloud-prod:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_DB:-768m}
    profiles: [cloud-prod]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-zabt}
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      default:
        aliases: [db]

  minio-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-minio:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_MINIO:-768m}
    profiles: [cloud-prod]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://api:8000/api/v1/webhooks/minio
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: "Bearer ${MINIO_WEBHOOK_SECRET:-}"
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /data/.minio/events
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      default:
        aliases: [minio]

  minio-init-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-mc:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    profiles: [cloud-prod]
    depends_on:
      - minio-cloud-prod
    restart: "no"
    mem_limit: ${ZABT_MEMORY_LIMIT_MINIO_INIT:-128m}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sleep 5
        mc alias set myminio http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "myminio/$$MINIO_BUCKET_NAME"
        mc event add "myminio/$$MINIO_BUCKET_NAME" arn:minio:sqs::PRIMARY:webhook --event put --ignore-existing
        echo "MinIO bucket + webhook configured"

  api-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-api:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_API:-768m}
    profiles: [cloud-prod]
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap_superuser && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media_data:/media
    environment:
      <<: [*cloud-prod-backend-environment, *cloud-prod-storage-environment, *cloud-prod-transcription-environment]
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:-}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      VISION_ENABLED: "true"
      VISION_BACKEND: local
      VISION_LOCAL_URL: http://zabt-vision-worker:8003
      VISION_INFERENCE_BACKEND: openai
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-gpt-4o-mini}
      VISION_REQUIRE_VISION: "true"
      VISION_CLOUD_ALLOWED: "true"
      VISION_EGRESS_POLICY: allowlist
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-api.openai.com}
      VISION_OPENAI_BASE_URL: ${VISION_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-gpt-4o-mini}
      VISION_OPENAI_IMAGE_DETAIL: ${VISION_OPENAI_IMAGE_DETAIL:-low}
      VISION_OPENAI_MAX_TOKENS: ${VISION_OPENAI_MAX_TOKENS:-1024}
      VISION_MAX_RETRIES: ${VISION_MAX_RETRIES:-2}
      VISION_RETRY_BACKOFF_SECONDS: ${VISION_RETRY_BACKOFF_SECONDS:-5}
      VISION_POLL_INTERVAL: ${VISION_POLL_INTERVAL:-5}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-1800}
      VISION_SIGNED_URL_EXPIRATION: ${VISION_SIGNED_URL_EXPIRATION:-3600}
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
      redis:
        condition: service_started
      db-cloud-prod:
        condition: service_healthy
      minio-init-cloud-prod:
        condition: service_completed_successfully
      worker-gpu-cloud-prod:
        condition: service_started
      zabt-vision-worker-cloud-prod:
        condition: service_started
    networks:
      default:
        aliases: [api]

  worker-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-worker:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_WORKER:-1g}
    profiles: [cloud-prod]
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    volumes:
      - media_data:/media
    environment:
      <<: [*cloud-prod-backend-environment, *cloud-prod-storage-environment, *cloud-prod-transcription-environment]
      VISION_ENABLED: "true"
      VISION_BACKEND: local
      VISION_LOCAL_URL: http://zabt-vision-worker:8003
      VISION_INFERENCE_BACKEND: openai
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-gpt-4o-mini}
      VISION_REQUIRE_VISION: "true"
      VISION_CLOUD_ALLOWED: "true"
      VISION_EGRESS_POLICY: allowlist
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-api.openai.com}
      VISION_OPENAI_BASE_URL: ${VISION_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-gpt-4o-mini}
      VISION_OPENAI_IMAGE_DETAIL: ${VISION_OPENAI_IMAGE_DETAIL:-low}
      VISION_OPENAI_MAX_TOKENS: ${VISION_OPENAI_MAX_TOKENS:-1024}
      VISION_SIGNED_URL_EXPIRATION: ${VISION_SIGNED_URL_EXPIRATION:-3600}
      VISION_MAX_RETRIES: ${VISION_MAX_RETRIES:-2}
      VISION_RETRY_BACKOFF_SECONDS: ${VISION_RETRY_BACKOFF_SECONDS:-5}
      VISION_POLL_INTERVAL: ${VISION_POLL_INTERVAL:-5}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-1800}
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
      redis:
        condition: service_started
      db-cloud-prod:
        condition: service_healthy
      minio-init-cloud-prod:
        condition: service_completed_successfully
      worker-gpu-cloud-prod:
        condition: service_started
      zabt-vision-worker-cloud-prod:
        condition: service_started

  beat-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-worker:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_BEAT:-256m}
    profiles: [cloud-prod]
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *cloud-prod-backend-environment
      TRANSCRIPTION_OPENAI_REQUEST_TIMEOUT_SECONDS: ${TRANSCRIPTION_OPENAI_REQUEST_TIMEOUT_SECONDS:-600}
      TRANSCRIPTION_OPENAI_MAX_RETRIES: ${TRANSCRIPTION_OPENAI_MAX_RETRIES:-2}
      MEETING_RECOVERY_GRACE_SECONDS: ${MEETING_RECOVERY_GRACE_SECONDS:-900}
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
      redis:
        condition: service_started
      db-cloud-prod:
        condition: service_healthy

  web-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-web:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_WEB:-512m}
    profiles: [cloud-prod]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ZABT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      ZABT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    depends_on:
      - api-cloud-prod

  worker-gpu-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-gpu-worker:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_WORKER_GPU:-4g}
    profiles: [cloud-prod]
    environment:
      MODE: local
      PORT: 8001
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      MEDASR_MODEL: ${MEDASR_MODEL:-google/medasr}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_MIN_SPEAKERS: ${DIARIZATION_MIN_SPEAKERS:-1}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - worker_model_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
    networks:
      default:
        aliases: [worker-gpu]

  zabt-vision-worker-cloud-prod:
    image: ghcr.io/danielrondongarcia/zabt-ai-vision-worker:${ZABT_IMAGE_TAG:-missing-zabt-image-tag}
    pull_policy: always
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_VISION_WORKER:-1g}
    profiles: [cloud-prod]
    environment:
      VISION_ENABLED: "true"
      VISION_INFERENCE_BACKEND: openai
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-gpt-4o-mini}
      VISION_CLOUD_ALLOWED: "true"
      VISION_EGRESS_POLICY: allowlist
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-api.openai.com}
      VISION_OPENAI_API_KEY: ${VISION_OPENAI_API_KEY:-}
      VISION_OPENAI_BASE_URL: ${VISION_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-gpt-4o-mini}
      VISION_OPENAI_IMAGE_DETAIL: ${VISION_OPENAI_IMAGE_DETAIL:-low}
      VISION_OPENAI_MAX_TOKENS: ${VISION_OPENAI_MAX_TOKENS:-1024}
      VISION_REQUIRE_VISION: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-}
      S3_BUCKET: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      OCR_USE_GPU: "false"
      OLLAMA_NO_CLOUD: "1"
    depends_on:
      cloud-prod-env-check:
        condition: service_completed_successfully
    networks:
      default:
        aliases: [zabt-vision-worker]

  # ---- Full-cloud application-only topology (profile: full-cloud) ----
  # Required variable presence is checked before app containers start. The check
  # receives only boolean flags, never secret values.
  full-cloud-env-check:
    image: alpine:3.22
    restart: "no"
    profiles: [full-cloud]
    environment:
      <<: *full-cloud-required-environment
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test "$$HAS_ZABT_API_IMAGE" = 1 || { echo "ZABT_API_IMAGE must be set in root .env" >&2; exit 1; }
        test "$$HAS_ZABT_WORKER_IMAGE" = 1 || { echo "ZABT_WORKER_IMAGE must be set in root .env" >&2; exit 1; }
        test "$$HAS_ZABT_WEB_IMAGE" = 1 || { echo "ZABT_WEB_IMAGE must be set in root .env" >&2; exit 1; }
        test "$$HAS_DATABASE_URL" = 1 || { echo "DATABASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_REDIS_URL" = 1 || { echo "REDIS_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_AUTH_JWT_SECRET" = 1 || { echo "AUTH_JWT_SECRET must be set in root .env" >&2; exit 1; }
        test "$$HAS_AUTH_ALLOWED_ORIGINS" = 1 || { echo "AUTH_ALLOWED_ORIGINS must be set in root .env" >&2; exit 1; }
        test "$$HAS_BACKEND_CORS_ORIGINS" = 1 || { echo "BACKEND_CORS_ORIGINS must be set in root .env" >&2; exit 1; }
        test "$$HAS_APP_URL" = 1 || { echo "APP_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_MCP_PUBLIC_URL" = 1 || { echo "MCP_PUBLIC_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_S3_ENDPOINT_URL" = 1 || { echo "S3_ENDPOINT_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_S3_ACCESS_KEY_ID" = 1 || { echo "S3_ACCESS_KEY_ID must be set in root .env" >&2; exit 1; }
        test "$$HAS_S3_SECRET_ACCESS_KEY" = 1 || { echo "S3_SECRET_ACCESS_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_S3_BUCKET_NAME" = 1 || { echo "S3_BUCKET_NAME must be set in root .env" >&2; exit 1; }
        test "$$HAS_S3_PUBLIC_URL" = 1 || { echo "S3_PUBLIC_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_ACTSIS_API_KEY" = 1 || { echo "ACTSIS_API_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_TRANSCRIPTION_BASE_URL" = 1 || { echo "TRANSCRIPTION_BASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_EMBEDDING_BASE_URL" = 1 || { echo "EMBEDDING_BASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_EMBEDDING_MODEL" = 1 || { echo "EMBEDDING_MODEL must be set in root .env" >&2; exit 1; }
        test "$$HAS_EMBEDDING_DIMENSION" = 1 || { echo "EMBEDDING_DIMENSION must be set in root .env" >&2; exit 1; }
        test "$$HAS_QDRANT_URL" = 1 || { echo "QDRANT_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_QDRANT_API_KEY" = 1 || { echo "QDRANT_API_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_OPENAI_BASE_URL" = 1 || { echo "OPENAI_BASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_OPENAI_API_KEY" = 1 || { echo "OPENAI_API_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_AI_CHAT_BASE_URL" = 1 || { echo "AI_CHAT_BASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_VISION_ALLOWED_HOSTS" = 1 || { echo "VISION_ALLOWED_HOSTS must be set in root .env" >&2; exit 1; }
        test "$$HAS_VISION_OPENAI_API_KEY" = 1 || { echo "VISION_OPENAI_API_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_VISION_OPENAI_BASE_URL" = 1 || { echo "VISION_OPENAI_BASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_NEXT_PUBLIC_API_URL" = 1 || { echo "NEXT_PUBLIC_API_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_NEXT_PUBLIC_FRONTEND_URL" = 1 || { echo "NEXT_PUBLIC_FRONTEND_URL must be set in root .env" >&2; exit 1; }
        echo "Full-cloud configuration is present."

  api-full-cloud:
    image: ${ZABT_API_IMAGE:-missing-required-full-cloud-api-image}
    restart: unless-stopped
    profiles: [full-cloud]
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap_superuser && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *full-cloud-backend-environment
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:-}
    depends_on:
      full-cloud-env-check:
        condition: service_completed_successfully
    networks:
      default:
        aliases: [api]

  worker-full-cloud:
    image: ${ZABT_WORKER_IMAGE:-missing-required-full-cloud-worker-image}
    restart: unless-stopped
    profiles: [full-cloud]
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment:
      <<: *full-cloud-backend-environment
    depends_on:
      full-cloud-env-check:
        condition: service_completed_successfully

  beat-full-cloud:
    image: ${ZABT_WORKER_IMAGE:-missing-required-full-cloud-worker-image}
    restart: unless-stopped
    profiles: [full-cloud]
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *full-cloud-backend-environment
    depends_on:
      full-cloud-env-check:
        condition: service_completed_successfully

  web-full-cloud:
    image: ${ZABT_WEB_IMAGE:-missing-required-full-cloud-web-image}
    restart: unless-stopped
    profiles: [full-cloud]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ZABT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      ZABT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    depends_on:
      full-cloud-env-check:
        condition: service_completed_successfully
      api-full-cloud:
        condition: service_started

  # ---- Optional add-ons ----
  # Teams meeting bot (headless browser). Enable by adding "bot" to COMPOSE_PROFILES.
  worker-bot:
    image: zabt-bot-worker:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_WORKER_BOT:-3g}
    profiles: [bot]
    shm_size: "2gb"
    build:
      context: ./zabt-bot-worker
    environment:
      PORT: 8002
      WORKER_ID: bot-worker-1
      BOT_DISPLAY_NAME: ${BOT_DISPLAY_NAME:-Zabt AI Notetaker}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      S3_REGION: ${S3_REGION:-auto}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      - redis

  # Visual breakdown worker. Supports local Ollama or explicit OpenAI cloud inference.
  # Enable the profile and VISION_ENABLED explicitly; the default remains disabled.
  # Vector store for local embeddings. Enabled for local, CPU, and local Actsis modes.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_QDRANT:-512m}
    profiles: [local, cpu, local-actsis]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabt-vision-worker:
    image: zabt-vision-worker:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_VISION_WORKER:-1g}
    profiles: [vision]
    build:
      context: ./zabt-vision-worker
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      VISION_JUDGE_MODEL: ${VISION_JUDGE_MODEL:-qwen3-vl:8b-thinking}
      VISION_INFERENCE_BACKEND: ${VISION_INFERENCE_BACKEND:-ollama}
      # Keep the vision credential separate from OPENAI_API_KEY, which may target
      # an OpenRouter or other-compatible summary endpoint.
      VISION_OPENAI_API_KEY: ${VISION_OPENAI_API_KEY:-}
      VISION_OPENAI_BASE_URL: ${VISION_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VISION_OPENAI_MODEL: ${VISION_OPENAI_MODEL:-gpt-4o-mini}
      VISION_OPENAI_IMAGE_DETAIL: ${VISION_OPENAI_IMAGE_DETAIL:-low}
      VISION_OPENAI_MAX_TOKENS: ${VISION_OPENAI_MAX_TOKENS:-1024}
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_REQUIRE_VISION: ${VISION_REQUIRE_VISION:-true}
      # Cloud access is opt-in; OpenAI mode requires explicitly setting these
      # values in the deployment environment.
      VISION_CLOUD_ALLOWED: ${VISION_CLOUD_ALLOWED:-false}
      VISION_EGRESS_POLICY: ${VISION_EGRESS_POLICY:-deny}
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_NO_CLOUD: ${OLLAMA_NO_CLOUD:-1}
      # Visual artifacts stay in the bundled MinIO by default. Explicit S3_*
      # variables override these local fallbacks for external S3-compatible storage.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      OCR_USE_GPU: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  media_data:
  redis_data:
  postgres_data:
  minio_data:
  worker_model_cache:
  qdrant_data:

networks:
  default: {}
