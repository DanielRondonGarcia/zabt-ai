  HAS_ZABT_API_IMAGE: ${ZABT_API_IMAGE:+1}
  HAS_ZABT_WORKER_IMAGE: ${ZABT_WORKER_IMAGE:+1}
  HAS_ZABT_WEB_IMAGE: ${ZABT_WEB_IMAGE:+1}
  HAS_DATABASE_URL: ${DATABASE_URL:+1}
  HAS_REDIS_URL: ${REDIS_URL:+1}
  HAS_AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:+1}
  HAS_AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:+1}
  HAS_BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:+1}
  HAS_APP_URL: ${APP_URL:+1}
  HAS_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:+1}
  HAS_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:+1}
  HAS_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:+1}
  HAS_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:+1}
  HAS_S3_BUCKET_NAME: ${S3_BUCKET_NAME:+1}
  HAS_S3_PUBLIC_URL: ${S3_PUBLIC_URL:+1}
  HAS_ACTSIS_API_KEY: ${ACTSIS_API_KEY:+1}
  HAS_TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:+1}
  HAS_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:+1}
  HAS_EMBEDDING_MODEL: ${EMBEDDING_MODEL:+1}
  HAS_EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:+1}
  HAS_QDRANT_URL: ${QDRANT_URL:+1}
  HAS_QDRANT_API_KEY: ${QDRANT_API_KEY:+1}
  HAS_OPENAI_BASE_URL: ${OPENAI_BASE_URL:+1}
  HAS_OPENAI_API_KEY: ${OPENAI_API_KEY:+1}
  HAS_AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:+1}
  HAS_VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:+1}
  HAS_VISION_OPENAI_API_KEY: ${VISION_OPENAI_API_KEY:+1}
  HAS_VISION_OPENAI_BASE_URL: ${VISION_OPENAI_BASE_URL:+1}
  HAS_NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:+1}
  HAS_NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:+1}

services:
  # ---- Profile-selected broker and backend services ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_REDIS:-256m}
    profiles: [local, cpu, local-actsis, cloud, cloud-prod, bot]
    volumes:
      - redis_data:/data

  cloud-prod-env-check:
    image: alpine:3.22
    restart: "no"
    profiles: [cloud-prod]
    environment:
      <<: *cloud-prod-required-environment
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test "$$HAS_ZABT_IMAGE_TAG" = 1 || { echo "ZABT_IMAGE_TAG must be set in root .env" >&2; exit 1; }
        test "$$HAS_DATABASE_URL" = 1 || { echo "DATABASE_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_AUTH_JWT_SECRET" = 1 || { echo "AUTH_JWT_SECRET must be set in root .env" >&2; exit 1; }
        test "$$HAS_AUTH_ALLOWED_ORIGINS" = 1 || { echo "AUTH_ALLOWED_ORIGINS must be set in root .env" >&2; exit 1; }
        test "$$HAS_BACKEND_CORS_ORIGINS" = 1 || { echo "BACKEND_CORS_ORIGINS must be set in root .env" >&2; exit 1; }
        test "$$HAS_APP_URL" = 1 || { echo "APP_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_MCP_PUBLIC_URL" = 1 || { echo "MCP_PUBLIC_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_POSTGRES_PASSWORD" = 1 || { echo "POSTGRES_PASSWORD must be set in root .env" >&2; exit 1; }
        test "$$HAS_MINIO_ACCESS_KEY" = 1 || { echo "MINIO_ACCESS_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_MINIO_SECRET_KEY" = 1 || { echo "MINIO_SECRET_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_MINIO_BUCKET_NAME" = 1 || { echo "MINIO_BUCKET_NAME must be set in root .env" >&2; exit 1; }
        test "$$HAS_MINIO_WEBHOOK_SECRET" = 1 || { echo "MINIO_WEBHOOK_SECRET must be set in root .env" >&2; exit 1; }
        test "$$HAS_OPENAI_API_KEY" = 1 || { echo "OPENAI_API_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_VISION_OPENAI_API_KEY" = 1 || { echo "VISION_OPENAI_API_KEY must be set in root .env" >&2; exit 1; }
        test "$$HAS_NEXT_PUBLIC_API_URL" = 1 || { echo "NEXT_PUBLIC_API_URL must be set in root .env" >&2; exit 1; }
        test "$$HAS_NEXT_PUBLIC_FRONTEND_URL" = 1 || { echo "NEXT_PUBLIC_FRONTEND_URL must be set in root .env" >&2; exit 1; }
        echo "Cloud-production configuration is present."

  api: &api-service
    profiles: [local, cpu, local-actsis]
    image: zabt-api:latest
    restart: unless-stopped
    mem_limit: ${ZABT_MEMORY_LIMIT_API:-768m}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    command: sh -c "alembic upgrade head && python -m app.bootstrap_superuser && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - media_data:/media
    environment: &api-environment
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      # LLM (summarization and retrieval chat) — OpenAI-compatible endpoint.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Chat can target a separate compatible gateway; by default it reuses OpenAI.
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      # First-party local auth. There is no Compose fallback: every backend
      # process must receive the same strong deployment secret.
      AUTH_ENVIRONMENT: ${AUTH_ENVIRONMENT:-development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set to a strong random value}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-zabt-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-zabt-client}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      AUTH_REFRESH_SESSION_EXPIRE_DAYS: ${AUTH_REFRESH_SESSION_EXPIRE_DAYS:-30}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-zabt_access_token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-zabt_refresh_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3001}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3001}
      # Public Streamable HTTP endpoint used by external MCP clients.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8000/api/v1/mcp}
      # Bootstrap credentials are read only by the API startup command. They
      # are never sent to worker or beat, and are not reapplied after creation.
      # Empty values allow restarts after provisioning; the bootstrap command
      # fails closed if no system superuser exists yet.
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:-}
      # Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zabt-ai-bucket}
      MINIO_WEBHOOK_SECRET: ${MINIO_WEBHOOK_SECRET:-change-me-in-production}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-zabt-ai-bucket}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      # Transcription selection is independent from summary/chat endpoint settings.
      # openai-file supports official OpenAI and compatible gateways such as Actsis.
      ACTSIS_API_KEY: ${ACTSIS_API_KEY:-}
      ACTSIS_CA_BUNDLE: ${ACTSIS_CA_BUNDLE:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-${TRANSCRIPTION_BACKEND:-gpu-local}}
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_PROVIDER:-${TRANSCRIPTION_BACKEND:-gpu-local}}
