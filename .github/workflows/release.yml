name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment to apply when version is omitted
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional exact version override, for example v1.2.3 or 1.2.3
        required: false
        type: string
      include_optional:
        description: Also publish the vision and bot worker images
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: "release-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      staging_tag: ${{ steps.release.outputs.staging_tag }}
      ghcr_owner: ${{ steps.release.outputs.ghcr_owner }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - name: Require dispatch from main
        shell: bash
        env:
          EVENT_REF: "${{ github.ref }}"
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be dispatched from the main branch; received $EVENT_REF."
            exit 1
          fi

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Restore initial GHCR preflight state on retry
        if: ${{ github.run_attempt != '1' }}
        uses: actions/download-artifact@v4
        with:
          name: ghcr-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ghcr-preflight

      - name: Resolve and validate version
        id: release
        shell: bash
        env:
          EVENT_REF: "${{ github.ref }}"
          RELEASE_TYPE: "${{ inputs.release_type }}"
          VERSION_INPUT: "${{ inputs.version }}"
          INCLUDE_OPTIONAL: "${{ inputs.include_optional }}"
          REPOSITORY_OWNER: "${{ github.repository_owner }}"
          COMMIT_SHA: "${{ github.sha }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          GHCR_USERNAME: "${{ github.actor }}"
          GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -Eeuo pipefail

          case "$RELEASE_TYPE" in
            patch|minor|major) ;;
            *)
              echo "::error::release_type must be patch, minor, or major."
              exit 1
              ;;
          esac

          case "$INCLUDE_OPTIONAL" in
            true|false) ;;
            *)
              echo "::error::include_optional must be a boolean input."
              exit 1
              ;;
          esac

          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$owner" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::The repository owner is not a valid lowercase GHCR namespace."
            exit 1
          fi

          git fetch --force --tags origin

          version="$(python3 - <<'PY'
          import os
          import re
          import subprocess

          release_type = os.environ["RELEASE_TYPE"]
          version_input = os.environ["VERSION_INPUT"]
          version_pattern = re.compile(
              r"^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
          )

          if version_input:
              match = version_pattern.fullmatch(version_input)
              if not match:
                  raise SystemExit(
                      "version must match the exact X.Y.Z or vX.Y.Z format "
                      "without leading zeroes"
                  )
              next_version = tuple(int(part) for part in match.groups())
          else:
              tags = subprocess.check_output(
                  ["git", "tag", "--list", "v*"],
                  text=True,
              ).splitlines()
              existing_versions = []
              for tag in tags:
                  match = version_pattern.fullmatch(tag)
                  if match:
                      existing_versions.append(tuple(int(part) for part in match.groups()))

              highest = max(existing_versions, default=(0, 0, 0))
              major, minor, patch = highest
              if release_type == "major":
                  next_version = (major + 1, 0, 0)
              elif release_type == "minor":
                  next_version = (major, minor + 1, 0)
              else:
                  next_version = (major, minor, patch + 1)

          print(".".join(str(part) for part in next_version))
          PY
          )"
          tag="v${version}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            existing_commit="$(git rev-parse "refs/tags/${tag}^{}")"
            if [[ "$RUN_ATTEMPT" == "1" || "$existing_commit" != "$COMMIT_SHA" ]]; then
              echo "::error::Release tag ${tag} already exists outside a retry of this run, or points to another commit."
              exit 1
            fi
          fi

          staging_tag="${tag}-run-${RUN_ID}"

          matrix="$(python3 - <<'PY'
          import json
          import os

          images = [
              {
                  "name": "api",
                  "image": "zabt-ai-api",
                  "context": "backend",
                  "file": "backend/Dockerfile",
                  "target": "api",
              },
              {
                  "name": "worker",
                  "image": "zabt-ai-worker",
                  "context": "backend",
                  "file": "backend/Dockerfile",
                  "target": "worker",
              },
              {
                  "name": "web",
                  "image": "zabt-ai-web",
                  "context": ".",
                  "file": "frontend-2/Dockerfile",
                  "target": "",
              },
              {
                  "name": "gpu-worker",
                  "image": "zabt-ai-gpu-worker",
                  "context": "zabt-gpu-worker",
                  "file": "zabt-gpu-worker/Dockerfile",
                  "target": "",
              },
              {
                  "name": "cpu-worker",
                  "image": "zabt-ai-cpu-worker",
                  "context": "zabt-gpu-worker",
                  "file": "zabt-gpu-worker/Dockerfile.cpu",
                  "target": "",
              },
          ]

          if os.environ["INCLUDE_OPTIONAL"] == "true":
              images.extend(
                  [
                      {
                          "name": "vision-worker",
                          "image": "zabt-ai-vision-worker",
                          "context": "zabt-vision-worker",
                          "file": "zabt-vision-worker/Dockerfile",
                          "target": "",
                      },
                      {
                          "name": "bot-worker",
                          "image": "zabt-ai-bot-worker",
                          "context": "zabt-bot-worker",
                          "file": "zabt-bot-worker/Dockerfile",
                          "target": "",
                      },
                  ]
              )

          print(json.dumps({"include": images}, separators=(",", ":")))
          PY
          )"

          if [[ "$RUN_ATTEMPT" == "1" ]]; then
            baseline_file="$RUNNER_TEMP/ghcr-preflight.json"
          else
            baseline_file="$RUNNER_TEMP/ghcr-preflight/ghcr-preflight.json"
          fi

          prepared_matrix="$(python3 .github/scripts/ghcr_release.py preflight \
            --owner "$owner" \
            --version-tag "$tag" \
            --staging-tag "$staging_tag" \
            --images-json "$matrix" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --commit "$COMMIT_SHA" \
            --baseline-file "$baseline_file")"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "staging_tag=${staging_tag}"
            echo "ghcr_owner=${owner}"
            echo "matrix<<MATRIX_JSON"
            printf '%s\n' "$prepared_matrix"
            echo "MATRIX_JSON"
          } >> "$GITHUB_OUTPUT"

      - name: Save initial GHCR preflight state for same-run retries
        if: ${{ github.run_attempt == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ghcr-preflight.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build ${{ matrix.name }} image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Restore this image's staging digest on retry
        if: ${{ github.run_attempt != '1' }}
        # A named-artifact download fails by default when absent in v4.
        uses: actions/download-artifact@v4
        with:
          name: ghcr-stage-${{ github.run_id }}-${{ matrix.image }}
          path: ${{ runner.temp }}/ghcr-stage

      - name: Require the original staging digest on retry
        if: ${{ always() && github.run_attempt != '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -s "$RUNNER_TEMP/ghcr-stage/ghcr-stage.json" ]]; then
            echo "::error::The original per-image staging digest artifact is missing. Do not rerun or rebuild this release version; follow the missing-artifact recovery instructions."
            exit 1
          fi

      - name: Plan build or verify the recorded staging manifest
        id: stage-plan
        shell: bash
        env:
          GHCR_USERNAME: "${{ github.actor }}"
          GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GHCR_OWNER: "${{ needs.prepare.outputs.ghcr_owner }}"
          REPOSITORY: "${{ github.repository }}"
          IMAGE: "${{ matrix.image }}"
          STAGING_TAG: "${{ needs.prepare.outputs.staging_tag }}"
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
          COMMIT_SHA: "${{ github.sha }}"
        run: |
          set -Eeuo pipefail

          record_file="$RUNNER_TEMP/ghcr-stage/ghcr-stage.json"
          if [[ "$RUN_ATTEMPT" != "1" ]]; then
            if [[ ! -s "$record_file" ]]; then
              echo "::error::The original staging digest artifact is missing. Do not rerun or rebuild this release version; follow the missing-artifact recovery instructions."
              exit 1
            fi
            python3 .github/scripts/ghcr_release.py verify-stage \
              --owner "$GHCR_OWNER" \
              --repository "$REPOSITORY" \
              --image "$IMAGE" \
              --staging-tag "$STAGING_TAG" \
              --run-id "$RUN_ID" \
              --commit "$COMMIT_SHA" \
              --record-file "$record_file"
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          state="$(python3 .github/scripts/ghcr_release.py tag-state \
            --owner "$GHCR_OWNER" \
            --image "$IMAGE" \
            --tag "$STAGING_TAG")"
          if [[ "$state" == "present" ]]; then
            echo "::error::The run-specific staging tag appeared before this build; refusing to reuse an unrecorded manifest. Choose a new release version."
            exit 1
          fi
          echo "build_required=true" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/${{ needs.prepare.outputs.ghcr_owner }}/${{ matrix.image }}"
          tags: |
            type=raw,value=${{ needs.prepare.outputs.staging_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push image
        id: build
        if: steps.stage-plan.outputs.build_required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.context }}"
          file: "${{ matrix.file }}"
          target: "${{ matrix.target }}"
          push: true
          tags: "${{ steps.metadata.outputs.tags }}"
          labels: "${{ steps.metadata.outputs.labels }}"
          cache-from: "type=gha,scope=${{ matrix.image }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.image }}"
          provenance: mode=max
          sbom: true

      - name: Record or verify the built staging manifest
        if: steps.stage-plan.outputs.build_required == 'true'
        shell: bash
        env:
          GHCR_USERNAME: "${{ github.actor }}"
          GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GHCR_OWNER: "${{ needs.prepare.outputs.ghcr_owner }}"
          REPOSITORY: "${{ github.repository }}"
          IMAGE: "${{ matrix.image }}"
          STAGING_TAG: "${{ needs.prepare.outputs.staging_tag }}"
          RUN_ID: "${{ github.run_id }}"
          COMMIT_SHA: "${{ github.sha }}"
          BUILDX_DIGEST: "${{ steps.build.outputs.digest }}"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ghcr-stage"
          python3 .github/scripts/ghcr_release.py record-stage \
            --owner "$GHCR_OWNER" \
            --repository "$REPOSITORY" \
            --image "$IMAGE" \
            --staging-tag "$STAGING_TAG" \
            --run-id "$RUN_ID" \
            --commit "$COMMIT_SHA" \
            --expected-digest "$BUILDX_DIGEST" \
            --record-file "$RUNNER_TEMP/ghcr-stage/ghcr-stage.json"

      - name: Save this image's immutable staging digest for same-run retries
        if: steps.stage-plan.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Existing artifacts are verified and reused; this step only runs when none exists.
          name: ghcr-stage-${{ github.run_id }}-${{ matrix.image }}
          path: ${{ runner.temp }}/ghcr-stage/ghcr-stage.json
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote ${{ matrix.name }} image
    needs:
      - prepare
      - build
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"

      - name: Restore this image's immutable staging digest
        # A named-artifact download fails by default when absent in v4.
        uses: actions/download-artifact@v4
        with:
          name: ghcr-stage-${{ github.run_id }}-${{ matrix.image }}
          path: ${{ runner.temp }}/ghcr-stage

      - name: Promote staged manifest to release tags
        shell: bash
        env:
          GHCR_USERNAME: "${{ github.actor }}"
          GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GHCR_OWNER: "${{ needs.prepare.outputs.ghcr_owner }}"
          REPOSITORY: "${{ github.repository }}"
          IMAGE: "${{ matrix.image }}"
          STAGING_TAG: "${{ needs.prepare.outputs.staging_tag }}"
          VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
          RUN_ID: "${{ github.run_id }}"
          COMMIT_SHA: "${{ github.sha }}"
          BASELINE_LATEST_DIGEST: "${{ matrix.baseline_latest_digest }}"
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/ghcr_release.py promote \
            --owner "$GHCR_OWNER" \
            --repository "$REPOSITORY" \
            --image "$IMAGE" \
            --staging-tag "$STAGING_TAG" \
            --version-tag "$VERSION_TAG" \
            --run-id "$RUN_ID" \
            --commit "$COMMIT_SHA" \
            --record-file "$RUNNER_TEMP/ghcr-stage/ghcr-stage.json" \
            --baseline-latest-digest "$BASELINE_LATEST_DIGEST"

  publish:
    name: Publish tag and GitHub Release
    needs:
      - prepare
      - promote
    if: ${{ needs.prepare.result == 'success' && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EVENT_REF: "${{ github.ref }}"
      VERSION: "${{ needs.prepare.outputs.version }}"
      TAG: "${{ needs.prepare.outputs.tag }}"
      GHCR_OWNER: "${{ needs.prepare.outputs.ghcr_owner }}"
      INCLUDE_OPTIONAL: "${{ inputs.include_optional }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0

      - name: Re-check branch and tag target
        id: tag-check
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_REF" != "refs/heads/main" ]]; then
            echo "::error::The release target is no longer main."
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out commit does not match the dispatch commit."
            exit 1
          fi

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            existing_commit="$(git rev-parse "refs/tags/${TAG}^{}")"
            if [[ "$RUN_ATTEMPT" == "1" || "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag ${TAG} exists outside a same-run retry, or points to another commit."
              exit 1
            fi
            tag_exists=true
          else
            tag_exists=false
          fi
          echo "exists=${tag_exists}" >> "$GITHUB_OUTPUT"

      - name: Create and push annotated Git tag
        shell: bash
        env:
          TAG_EXISTS: "${{ steps.tag-check.outputs.exists }}"
        run: |
          set -Eeuo pipefail

          if [[ "$TAG_EXISTS" == "true" ]]; then
            echo "Release tag ${TAG} already points to this workflow commit; keeping it unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$GITHUB_SHA" --message "Release $TAG"
          if git push origin "$TAG"; then
            exit 0
          fi

          echo "Tag push returned an error; verifying the remote outcome before failing."
          if ! remote_refs="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"; then
            echo "::error::Could not verify whether release tag ${TAG} reached origin."
            exit 1
          fi
          if [[ -z "$remote_refs" ]]; then
            echo "::error::Release tag ${TAG} was not created on origin."
            exit 1
          fi
          tag_ref="refs/tags/${TAG}"
          remote_commit="$(awk -v ref="$tag_ref" '
            $2 == (ref "^{}") { peeled = $1 }
            $2 == ref { object = $1 }
            END { if (peeled != "") print peeled; else if (object != "") print object }
          ' <<< "$remote_refs")"
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag ${TAG} points to ${remote_commit}, not ${GITHUB_SHA}; refusing to retag."
            exit 1
          fi
          echo "Verified that release tag ${TAG} points to this workflow commit."

      - name: Create GitHub Release with generated notes
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -Eeuo pipefail

          release_is_complete() {
            local release_json="$1"
            jq -e --arg tag "$TAG" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
              <<< "$release_json" >/dev/null
          }

          if existing_release="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            if ! release_is_complete "$existing_release"; then
              echo "::error::Release ${TAG} exists but is not the completed release expected by this workflow."
              exit 1
            fi
            echo "GitHub Release ${TAG} already exists for the verified same-commit tag; leaving it unchanged."
            exit 0
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          {
            echo "## Published container images"
            echo
            for image in \
              zabt-ai-api \
              zabt-ai-worker \
              zabt-ai-web \
              zabt-ai-gpu-worker \
              zabt-ai-cpu-worker; do
              echo "- ghcr.io/${GHCR_OWNER}/${image}:${TAG}"
              echo "- ghcr.io/${GHCR_OWNER}/${image}:latest"
            done

            if [[ "$INCLUDE_OPTIONAL" == "true" ]]; then
              for image in zabt-ai-vision-worker zabt-ai-bot-worker; do
                echo "- ghcr.io/${GHCR_OWNER}/${image}:${TAG}"
                echo "- ghcr.io/${GHCR_OWNER}/${image}:latest"
              done
            fi
          } > "$notes_file"

          if gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --notes-file "$notes_file"; then
            exit 0
          fi

          echo "Release creation returned an error; checking whether GitHub accepted it."
          if existing_release="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease 2>/dev/null)" \
            && release_is_complete "$existing_release"; then
            echo "Verified that GitHub Release ${TAG} exists and is complete."
            exit 0
          fi
          echo "::error::GitHub Release ${TAG} could not be confirmed after creation failed."
          exit 1
