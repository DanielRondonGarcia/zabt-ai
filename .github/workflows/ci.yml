name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format --check (advisory)
        continue-on-error: true
        run: uvx ruff format --check .

  release-workflow-tests:
    name: GHCR release helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline release helper tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Compile release helper
        run: python -m py_compile .github/scripts/ghcr_release.py .github/scripts/test_ghcr_release.py

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: zabt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/zabt_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_JWT_SECRET: ci-only-local-auth-secret-0123456789abcdef
      AUTH_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      OPENAI_API_KEY: test-key
      OPENAI_BASE_URL: https://example.invalid/v1
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: zabt-media
      MINIO_WEBHOOK_SECRET: ci-minio-webhook-token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Prepare media dir
        run: sudo mkdir -p /media/styles && sudo chmod -R 777 /media
      - name: Start MinIO + create bucket
        run: |
          docker build --tag zabt-ai-minio:ci --file docker/minio/Dockerfile docker/minio
          docker build --tag zabt-ai-mc:ci --file docker/minio/Dockerfile.mc docker/minio
          # This job exercises object storage, not webhook delivery; no API receiver runs here.
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            zabt-ai-minio:ci server /data --console-address :9001
          healthy=0
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "MinIO did not become healthy after 40 seconds." >&2
            docker logs minio || true
            exit 1
          fi
          docker run --rm --network host --entrypoint /bin/sh zabt-ai-mc:ci -ec \
            'mc alias set m http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing m/zabt-media'
      - name: Install backend deps
        working-directory: backend
        run: uv sync
      - name: Apply migrations to test DB
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run unit tests
        working-directory: backend
        # Generate an ephemeral Fernet key at runtime (keeps secret-shaped strings out of the repo)
        run: |
          TOKEN_ENCRYPTION_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export TOKEN_ENCRYPTION_KEY
          uv run pytest tests/unit -q
      - name: Run isolated summary pipeline tests
        working-directory: backend
        run: >-
          uv run pytest --noconftest
          app/tests/unit/test_model_summary_stage.py
          app/tests/unit/test_model_title_stage.py
          app/tests/unit/test_model_extraction_stages.py
          app/tests/unit/test_model_stage_dispatch.py
          app/tests/unit/test_model_recovery_dispatch.py
          app/tests/unit/test_summary_stage_preservation.py
          app/tests/unit/test_model_completion_transaction.py -q

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Test model-stage progress mapping
        run: node --test frontend-2/tests/stage-utils.test.cjs
      - name: Type-check frontend
        working-directory: frontend-2
        run: npx tsc --noEmit
      - name: Lint frontend
        working-directory: frontend-2
        run: npx eslint . || true
