name: Docker build

on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'backend/**'
      - 'frontend-2/**'
      - 'packages/**'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-validate:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Validate single-machine config
        run: docker compose --env-file .env config --quiet
      - name: Validate CPU override
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.cpu.yml config --quiet
      - name: Validate cloud override
        env:
          COMPOSE_PROFILES: ''
        run: docker compose --env-file .env -f docker-compose.yml -f docker-compose.cloud.yml config --quiet
      - name: Validate cloud production override
        env:
          COMPOSE_DISABLE_ENV_FILE: '1'
          COMPOSE_PROFILES: cloud-prod
          ZABT_API_IMAGE: ghcr.io/example/zabt-ai-api:v0.0.0
          ZABT_WORKER_IMAGE: ghcr.io/example/zabt-ai-worker:v0.0.0
          ZABT_WEB_IMAGE: ghcr.io/example/zabt-ai-web:v0.0.0
          ZABT_VISION_IMAGE: ghcr.io/example/zabt-ai-vision-worker:v0.0.0
          DATABASE_URL: postgresql+asyncpg://ci:ci@managed-db.example.test:5432/zabt
          AUTH_JWT_SECRET: ci-dummy-auth-secret-not-a-real-secret
          AUTH_ALLOWED_ORIGINS: https://web.example.test
          BACKEND_CORS_ORIGINS: https://web.example.test
          APP_URL: https://web.example.test
          S3_ENDPOINT_URL: https://s3.example.test
          S3_ACCESS_KEY_ID: ci-dummy-s3-access-key
          S3_SECRET_ACCESS_KEY: ci-dummy-s3-secret-key
          S3_BUCKET_NAME: ci-dummy-bucket
          S3_PUBLIC_URL: https://s3-public.example.test
          RUNPOD_API_KEY: ci-dummy-runpod-key
          RUNPOD_ENDPOINT_ID: ci-dummy-runpod-endpoint
          OPENAI_API_KEY: ci-dummy-openai-summary-key
          VISION_OPENAI_API_KEY: ci-dummy-openai-vision-key
          NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_FRONTEND_URL: https://web.example.test
        run: docker compose -f docker-compose.yml -f docker-compose.cloud.prod.yml config --quiet

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lightweight API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          push: false
          tags: zabt-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
