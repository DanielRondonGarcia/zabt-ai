# OpenSpec SDD Configuration — zabt-ai
# Auto-generated by sdd-init executor. Do not manually edit; use /sdd-config to update.

project: zabt-ai
description: >
  Zabt is an AI meeting assistant platform (formerly Pareto AI). The stack
  comprises a Python 3.11 / FastAPI / SQLModel / Celery (Redis broker) backend,
  a TypeScript / Next.js 16 / React 19 / Tailwind CSS 4 / shadcn/ui frontend,
  and infrastructure backed by PostgreSQL, Redis, MinIO/S3, Qdrant (vector DB),
  Kong API Gateway, and Celery workers.
version: "1.0"

# --- SDD execution defaults ---
execution_mode: auto
artifact_store: openspec
delivery_strategy: ask-on-risk
delivery_strategy_domain: ask-on-risk
review_budget: 400
chain_strategy: deferred

# --- Strict TDD gate ---
strict_tdd: true
phase_rules:
  explore:
    description: Explore the problem space; produce exploration artifact.
    gates:
      - no_code_changes
  research:
    description: Collect evidence for design decisions; produce research artifact.
    gates:
      - no_code_changes
      - product_decisions_confirmed
  propose:
    description: Create proposal + spec changes; produce proposal artifact.
    gates:
      - no_code_changes
      - research_admitted
  design:
    description: Produce implementation design (architecture, files, sequences).
    gates:
      - no_code_changes
  tasks:
    description: Break design into reviewable work-unit tasks.
    gates:
      - design_approved
  apply:
    description: Implement tasks; tests before code.
    gates:
      - tests_writing_first
      - review_budget_respected
  verify:
    description: Run tests and verification; produce verify report.
    gates:
      - all_tests_pass
      - review_budget_respected

# --- Testing configuration ---
testing:
  backend:
    runner: pytest
    framework: pytest-asyncio
    packages:
      - pytest>=9.0.3
      - pytest-asyncio>=1.3.0
    test_location: backend/app/tests/  # unit/integration tests live alongside app
    e2e_location: tests/e2e/
    coverage:
      enabled: true
      target: 70
  frontend:
    runner: npm test  # vitest (when configured)
    framework: vitest
    test_location: frontend-2/src/__tests__/
  convention:
    test_first: true          # tests written before implementation code
    tests_with_code: true     # tests committed alongside code changes
    failing_test_required: true  # red phase must fail before green

# --- Project skills (from .atl/skill-registry.md) ---
skills:
  registry_path: .atl/skill-registry.md
  index_auto: true

# --- Archival ---
archive:
  directory: openspec/changes/archive
  timestamp_format: "%Y-%m-%d-{change-name}"

# --- Spec versioning ---
specs:
  directory: openspec/specs
  format: spec.md

# --- Change tracking ---
changes:
  directory: openspec/changes
