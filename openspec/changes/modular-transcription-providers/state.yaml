  product_decisions:
    status: confirmed
    items:
      - First batch candidate is `gpt-transcribe`, configurable through the transcription provider/model environment settings.
      - `SPEAKER_UNKNOWN` is accepted for the first batch slice; the normalizer must not fabricate speaker labels.
      - If speakers are required later, diarization is a cloud-provider responsibility; providers without cloud diarization are not eligible for that mode.
      - Medical transcription remains on the existing local/RunPod MedASR path; OpenAI general transcription does not replace it.
      - Realtime transcription remains excluded from the first batch implementation slice.
